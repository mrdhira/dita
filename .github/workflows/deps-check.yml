name: deps-check

# Pins carry upper bounds, so a new release never arrives on its own. This is the thing
# that notices one has landed.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check for outdated dependencies
        id: check
        run: |
          set -o pipefail
          make deps-check 2>&1 | tee outdated.txt || true
          # uv prints a header plus one row per outdated package; no rows means current.
          if grep -qE '^[A-Za-z0-9_.-]+[[:space:]]+[0-9]' outdated.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "deps: outdated Python dependencies in services/inferences-ocr"
        run: |
          # A fork or a token-less run should report, not fail the workflow.
          if ! gh auth status >/dev/null 2>&1; then
            echo "::warning::no GitHub credentials available; printing the report instead"
            cat outdated.txt
            exit 0
          fi

          BODY=$(printf 'Found by the weekly `deps-check` workflow (run %s).\n\n```\n%s\n```\n\nBump the floors in `services/inferences-ocr/requirements.txt`, rebuild the image, and re-run the suite.' \
            "$GITHUB_RUN_ID" "$(cat outdated.txt)")

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label dependencies || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi
