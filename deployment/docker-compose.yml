services:
  dita-orchestrator-rest:
    build: 
      context: ../services/dita-orchestrator
      dockerfile: Dockerfile
    container_name: dita-orchestrator-rest
    ports:
      - "2104:2104"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      # The orchestrator dials the inference workers over this shared socket directory.
      - ../run:/run/dita
    # Start order matters for the shared directory: the worker creates the socket in it,
    # and it runs as a non-root user. Starting it first keeps ownership deterministic.
    depends_on:
      inferences-ocr:
        condition: service_healthy
    command: ["serveRest"]
    restart: unless-stopped

  inferences-ocr:
    build:
      # The context is the repo root, not the service directory. The workspace root
      # pyproject.toml and the single uv.lock live at the top of the repo, and a build
      # context cannot reach outside itself.
      context: ..
      dockerfile: services/inferences-ocr/Dockerfile
    container_name: inferences-ocr
    environment:
      - SOCKET_PATH=/run/dita/inferences-ocr.sock
      - MODELS_DIR=/models
      - OCR_LOG_LEVEL=info
    # Bind mounts, not named volumes: both directories live in the repo, so they can be
    # inspected with ls and reset with rm -rf. Their contents are gitignored; a .gitkeep
    # keeps the directory itself in git.
    volumes:
      - ../run:/run/dita
      # Weights are fetched on first load and cached here. Never baked into the image,
      # never committed. `rm -rf services/inferences-ocr/models/*` is a full reset.
      - ../services/inferences-ocr/models:/models
    # One model resident at a time; PP-OCRv5 needs a few hundred MB, manga-ocr ~800MB.
    # Raise mem_limit before selecting manga-ocr as the steady-state model.
    mem_limit: 2g
    cpus: 1.0
    # The image's non-root user is uid 10001. Run as the invoking user instead so the
    # bind-mounted repo directories stay writable and the files it fetches stay yours.
    user: "${UID:-1000}:${GID:-1000}"
    # An exec probe, not an HTTP one: this service has no HTTP surface and is not getting
    # a TCP listener just for health. `readyz` stays true through a cold model load -- a
    # load in flight is progress, not a wedge -- so the long start_period only has to
    # cover process start and the socket bind.
    healthcheck:
      test: ["CMD", "python", "-m", "ocr_worker", "--probe", "ready"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
