services:
  dita-orchestrator-rest:
    build: 
      context: ../services/dita-orchestrator
      dockerfile: Dockerfile
    container_name: dita-orchestrator-rest
    ports:
      - "2104:2104"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      # The orchestrator dials the inference workers over this shared socket directory.
      - dita-sockets:/run/dita
    # Start order matters for the shared volume. A named volume takes its ownership from
    # the first image directory that covers it; the orchestrator is FROM scratch and has
    # no /run/dita, so it would seed a root-owned directory that the worker's non-root
    # user cannot bind into. Starting the worker first makes the ownership deterministic
    # rather than a race. The orchestrator runs as root, so it can open the socket either
    # way.
    depends_on:
      inferences-ocr:
        condition: service_started
    command: ["serveRest"]
    restart: unless-stopped

  inferences-ocr:
    build:
      context: ../services/inferences-ocr
      dockerfile: Dockerfile
    container_name: inferences-ocr
    environment:
      - SOCKET_PATH=/run/dita/inferences-ocr.sock
      - MODELS_DIR=/models
      - OCR_LOG_LEVEL=info
    volumes:
      - dita-sockets:/run/dita
      # Weights are fetched on first load and cached here. Never baked into the image,
      # never committed.
      - ocr-models:/models
    # One model resident at a time; PP-OCRv5 needs a few hundred MB, manga-ocr ~800MB.
    # Raise mem_limit before selecting manga-ocr as the steady-state model.
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped

volumes:
  dita-sockets:
  ocr-models:
