[project]
name = "dita-worker"
version = "0.1.0"
description = "The inference worker framework: one resident model, fetched by digest, served over DIP"
readme = "README.md"
requires-python = ">=3.14.6"

dependencies = [
    "dip",
    # The only third-party runtime import in this package, and only in registry.py: a
    # model manifest is YAML. Everything else here is stdlib.
    "pyyaml>=6.0.3,<7",
]

[tool.uv.sources]
dip = { workspace = true }

[dependency-groups]
dev = ["coverage>=7.6,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dita_worker"]
