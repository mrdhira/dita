[project]
name = "textinfer"
version = "0.1.0"
description = "What a TEI-compatible text worker needs beyond `worker`: TEI's error contract and token-budgeted ONNX batches"
readme = "README.md"
requires-python = ">=3.14.6"

dependencies = [
    "worker",
    "numpy>=2.5,<3",
    # Imported only by `open_session`, so the TEI half is usable without it.
    "onnxruntime>=1.30,<2",
]

[tool.uv.sources]
worker = { workspace = true }

[dependency-groups]
dev = ["coverage>=7.16.1,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textinfer"]
