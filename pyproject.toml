# Virtual workspace root, not a package. Why two levels of pyproject: see README.md.

[tool.uv.workspace]
members = ["services/*", "packages/pylibs/*"]
# uv errors on a matched directory with no pyproject.toml. Drop an entry here when that
# directory becomes a real member, or it stays out of the lock silently.
exclude = [
    "services/dita-orchestrator",
    "services/inferences-stt",
    "services/inferences-tts",
]

[tool.uv]
required-version = ">=0.12"
