# The orchestrator on the shared `proxy` network, so it reaches the inference workers by
# container name: they publish no ports, and nothing off that network can resolve them.
# `make up` from this directory.
name: dita-orchestrator

services:
  dita-orchestrator-rest:
    build:
      context: .
      dockerfile: Dockerfile
    image: dita-orchestrator:local
    # The same name deployment/docker-compose.yml uses: the two are alternatives, and a
    # fixed name makes running both at once fail loudly rather than split the port.
    container_name: dita-orchestrator-rest
    command: ["serveRest"]
    restart: unless-stopped
    environment:
      # serveRest refuses to start without it; /api/v1/chat is the only route that uses it.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      INFERENCES_EMBEDDING_URL: http://inferences-embedding:8080
      INFERENCES_RERANKER_URL: http://inferences-reranker:8080
      INFERENCES_SYSTEM_ONE_URL: http://inferences-system-one:8080
      # The reranker needs up to ~85 s for 32 pairs under load.
      INFERENCES_TIMEOUT: 120s
      DECISIONS_DIR: /data/decisions
      # Off when empty. For programmatic clients; never injected by a proxy (gateway doc, "Writes").
      INFERENCES_API_TOKEN: ${INFERENCES_API_TOKEN:-}
      # The GC works against the container's real ceiling instead of letting the heap double past it.
      GOMEMLIMIT: 200MiB
    volumes:
      # The training store: prediction and correction pairs, append-only. A named volume,
      # so `compose down` and a redeploy keep it; only `down -v` would drop it, and must not.
      - dita-decisions:/data/decisions
    # Published on loopback only, which does not keep the LAN out: the host's Caddy proxies
    # orchestrator.api.home.arpa here by name on `proxy`, and every container on `proxy` reaches
    # it directly. Writes are guarded in the app (cross-site and non-JSON POSTs refused) and by
    # INFERENCES_API_TOKEN when it is set; reads are open to anyone who can reach it.
    ports:
      - "127.0.0.1:2104:2104"
    mem_limit: 256m
    cpus: 1.0
    networks:
      - proxy

volumes:
  dita-decisions:

networks:
  proxy:
    external: true
