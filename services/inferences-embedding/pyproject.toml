[project]
name = "inferences-embedding"
version = "0.1.0"
description = "Text embedding worker: one resident model, DIP for its lifecycle, TEI's /embed for its vectors"
readme = "README.md"
requires-python = ">=3.14.6"

dependencies = [
    "worker",
    "onnxruntime>=1.30,<2",
    "numpy>=2.5,<3",
    # The Rust tokenizer that reads tokenizer.json. The alternative is transformers, which
    # would pull torch in to do the same job.
    "tokenizers>=0.23.2,<1",
]

[tool.uv.sources]
worker = { workspace = true }

[dependency-groups]
dev = ["coverage>=7.16.1,<8"]

[tool.uv]
# An application, not a library: uv installs its dependencies but never builds or
# publishes it. Shared code under packages/ stays installable.
package = false
