[project]
name = "inferences-ocr"
version = "0.1.0"
description = "OCR inference worker: one resident model, answered over a unix socket"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "rapidocr>=3.9.2,<4",
    "onnxruntime>=1.30,<2",
    "numpy>=2.5,<3",
    "pillow>=12.3,<13",
    "pyyaml>=6.0.3,<7",
    # Not opencv-python-headless: rapidocr depends on the non-headless distribution, and
    # asking for headless as well would land two copies of cv2 in the image. The Dockerfile
    # installs the GL and glib shared libraries this one links against.
    "opencv-python>=5.0,<6",
]

# Dev-only. PEP 735 groups are never part of [project.dependencies], so they cannot
# reach the runtime image: the Dockerfile exports with --no-default-groups.
[dependency-groups]
dev = [
    "coverage>=7.6,<8",
]

[tool.setuptools]
packages = ["ocr_worker", "ocr_worker.engines"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
