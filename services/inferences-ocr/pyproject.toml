[project]
name = "inferences-ocr"
version = "0.1.0"
description = "OCR inference worker: one resident model, answered over a unix socket"
readme = "README.md"
requires-python = ">=3.14.6"

dependencies = [
    "rapidocr>=3.9.2,<4",
    "onnxruntime>=1.30,<2",
    "numpy>=2.5,<3",
    "pillow>=12.3,<13",
    "pyyaml>=6.0.3,<7",
    # Not opencv-python-headless: rapidocr needs the non-headless distribution, and asking
    # for both lands two copies of cv2 in the image.
    "opencv-python>=5.0,<6",
]

[dependency-groups]
dev = ["coverage>=7.6,<8"]

[tool.uv]
# An application, not a library: uv installs its dependencies but never builds or
# publishes it. Shared code under packages/ stays installable.
package = false
