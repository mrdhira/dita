[project]
name = "inferences-reranker"
version = "0.1.0"
description = "Cross-encoder reranker worker: one resident model, DIP for its lifecycle, TEI's /rerank for its scores"
readme = "README.md"
requires-python = ">=3.14.6"

dependencies = [
    "worker",
    "textinfer",
    "numpy>=2.5,<3",
    "tokenizers>=0.23.2,<1",
]

[tool.uv.sources]
worker = { workspace = true }
textinfer = { workspace = true }

[dependency-groups]
dev = ["coverage>=7.16.1,<8"]

[tool.uv]
# An application, not a library: uv installs its dependencies but never builds or
# publishes it. Shared code under packages/ stays installable.
package = false
